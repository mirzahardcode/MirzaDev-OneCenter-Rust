[package]
name = "mirzadev-onecenter"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
thiserror = "2"
log = "0.4"
directories = "6"
env_logger = "0.11"
open = "5"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
